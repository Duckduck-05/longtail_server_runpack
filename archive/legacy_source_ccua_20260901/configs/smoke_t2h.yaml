# Infrastructure smoke for the T2H/OC row only: a 20-step train, a coarse
# ancestral-DDPM sampling pass, and the array export the shared evaluator
# consumes. Not scientific evidence -- it exists to prove OC's evaluator can
# load a torch.compile'd training checkpoint on a real GPU before a 300k-step
# campaign commits to it again.
campaign:
  name: smoke_t2h_v1
  description: "20-step T2H infrastructure test; not scientific evidence"
  server_config: configs/server.yaml
  paired_seeds: [0]
  strict_preflight: false

repositories:
  oc:
    url: https://github.com/MediaBrain-SJTU/OC_LT.git
    commit: ced184378e8dc784958b6e14fd687781babd836d
    directory: OC_LT

shared_backbone:
  adapter: oc
  train:
    lr: 0.0002
    batch_size: 16
    total_steps: 20
    save_step: 10
    sample_step: 1000
    T: 1000
    dropout: 0.1
    warmup: 5000
    num_workers: 2
    ch: 128
    ch_mult: [1, 2, 2, 2]
    attn: [1]
    num_res_blocks: 2
    ema_decay: 0.9999
    conditional: true
    cfg: true
  eval:
    checkpoint_step: 20
    num_images: 64
    sample_batch_size: 32
    guidance_scale: 1.0
    uniform_labels: true
    # method stays ancestral DDPM so the production branch is the one
    # exercised; only the stride is coarsened so a smoke finishes in seconds.
    sample_method: ddpm
    ddim_skip_step: 100
    paper_metrics: false

stages:
  - name: smoke_t2h
    enabled: true
    priority: 100
    adapter: oc
    dataset:
      name: cifar100lt_smoke
      data_type: cifar100lt
      imbalance_factor: 0.01
      num_class: 100
      img_size: 32
      root: ${LTX_DATA_ROOT:-./data}
    methods:
      - {name: t2h}
    seeds: [0]
    tags: [smoke]

aggregation:
  enabled: false
