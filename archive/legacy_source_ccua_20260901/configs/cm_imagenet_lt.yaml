campaign:
  name: cm_baselines_v1
  # This is a released-code sensitivity port, not a literal CM paper-table
  # reproduction. The supplied CM prose says 300k updates, while the vendored
  # CIFAR-10 config uses 200k and its CIFAR-100 config uses 300k. Preserve that
  # discrepancy visibly instead of choosing a number after seeing results.
  description: "CM released-code sensitivity: DDPM, CBDM, OC, CM on CIFAR-LT and ImageNet-LT"
  paper_protocol: cm_baselines_fid_kid
  server_config: configs/server.yaml
  paired_seeds: [0, 1, 2]
  strict_preflight: true

# Leave empty for a baseline-only reproduction.  Once the proposed method has
# been added as a task, set LTX_CANDIDATE_METHOD to its task method name; the
# report then computes paired-seed advantages, percentile CIs and win flags.
comparison:
  candidate_method: ${LTX_CANDIDATE_METHOD:-}
  require_candidate_for_paper_claim: ${LTX_REQUIRE_CANDIDATE_FOR_PAPER_CLAIM:-false}
  bootstrap_repetitions: 10000
  confidence_level: 0.95

repositories:
  cm:
    url: https://github.com/Feng-Hong/ImbDiff-CM.git
    commit: 04262d7efc4130fda551fa1a1a22d8d5af636899
    directory: ImbDiff-CM

stages:
  - name: cifar10_lt_ir100
    adapter: cm
    priority: 90
    dataset:
      name: cifar10lt_ir100
      data_type: cifar10lt
      root: ${LTX_DATA_ROOT:-./data}
      num_classes: 10
      img_size: 32
    methods:
      - name: ddpm
        upstream_method: oc
        config_overrides: {transfer: {transfer_x0: false}}
      - name: cbdm
        upstream_method: cbdm
        config_overrides: {transfer: {transfer_x0: false}, cbdm: {tau: 1.0}}
      - name: oc
        upstream_method: oc
        config_overrides: {transfer: {transfer_x0: true, transfer_mode: t2h}}
      - name: cm
        upstream_method: cm
    seeds: [0, 1, 2]
    train: {total_steps: 200001, batch_size: 64, num_workers: 4}
    eval: {checkpoint_step: 200000, num_images: 50000}
    tags: [cifar10-lt, cm-source, baseline, paired-seeds]

  - name: cifar100_lt_ir100
    adapter: cm
    priority: 90
    dataset:
      name: cifar100lt_ir100
      data_type: cifar100lt
      root: ${LTX_DATA_ROOT:-./data}
      num_classes: 100
      img_size: 32
    methods:
      - name: ddpm
        upstream_method: oc
        config_overrides: {transfer: {transfer_x0: false}}
      - name: cbdm
        upstream_method: cbdm
        config_overrides: {transfer: {transfer_x0: false}, cbdm: {tau: 1.0}}
      - name: oc
        upstream_method: oc
        config_overrides: {transfer: {transfer_x0: true, transfer_mode: t2h}}
      - name: cm
        upstream_method: cm
    seeds: [0, 1, 2]
    train: {total_steps: 300001, batch_size: 64, num_workers: 4}
    eval: {checkpoint_step: 300000, num_images: 50000}
    tags: [cifar100-lt, cm-source, baseline, paired-seeds]

  # Table 5 reports both resolutions.  Keep them as separate stages so they
  # can occupy different GPUs concurrently and resume independently.
  - name: imagenet_lt_32
    adapter: cm
    priority: 90
    dataset:
      name: imagenet_lt
      data_type: imagenet_lt
      root: ${LTX_IMAGENET_ROOT:-}
      manifest: ${LTX_IMAGENET_LT_TRAIN_MANIFEST:-}
      reference_manifest: ${LTX_IMAGENET_LT_REFERENCE_MANIFEST:-}
      num_classes: 1000
      img_size: 32
    methods:
      # Every row uses the same released CM code, architecture, train steps,
      # sampler, ImageNet-LT manifest and three paired seeds.  Only the stated
      # mechanism differs.
      - name: ddpm
        upstream_method: oc
        config_overrides:
          transfer:
            transfer_x0: false
      - name: cbdm
        upstream_method: cbdm
        config_overrides:
          transfer:
            transfer_x0: false
          cbdm:
            tau: 1.0
      - name: oc
        upstream_method: oc
        config_overrides:
          transfer:
            transfer_x0: true
            transfer_mode: t2h
      - name: cm
        upstream_method: cm
    seeds: [0, 1, 2]
    train:
      total_steps: 300001
      batch_size: 64
      num_workers: 8
    eval:
      checkpoint_step: 300000
      num_images: 50000
    tags: [imagenet-lt, cm-source-port, baseline, paired-seeds]

  - name: imagenet_lt_64
    adapter: cm
    priority: 90
    dataset:
      name: imagenet_lt
      data_type: imagenet_lt
      root: ${LTX_IMAGENET_ROOT:-}
      manifest: ${LTX_IMAGENET_LT_TRAIN_MANIFEST:-}
      reference_manifest: ${LTX_IMAGENET_LT_REFERENCE_MANIFEST:-}
      num_classes: 1000
      img_size: 64
    methods:
      - name: ddpm
        upstream_method: oc
        config_overrides:
          transfer:
            transfer_x0: false
      - name: cbdm
        upstream_method: cbdm
        config_overrides:
          transfer:
            transfer_x0: false
          cbdm:
            tau: 1.0
      - name: oc
        upstream_method: oc
        config_overrides:
          transfer:
            transfer_x0: true
            transfer_mode: t2h
      - name: cm
        upstream_method: cm
    seeds: [0, 1, 2]
    train:
      total_steps: 300001
      batch_size: 64
      num_workers: 8
    eval:
      checkpoint_step: 300000
      num_images: 50000
    tags: [imagenet-lt, cm-source-port, baseline, paired-seeds]
