# Secondary / ACCESS-only ImageNet-LT setting.
#
# This is deliberately separate from the locked CIFAR main table.  It contains
# only the two requested 64x64 rows: a plain DDPM objective and CCUA, seed 0,
# with the ImageNet-LT train manifest and a checkpoint at update 300,000.
campaign:
  name: secondary_imagenet_lt_t2h_v1
  description: "Deferred ImageNet-LT 64x64: DDPM and CCUA, seed 0, 300k"
  protocol: imagenet_lt_secondary_v1
  paper_protocol: imagenet_lt_secondary_fid_kid
  server_config: configs/server.yaml
  paired_seeds: [0]
  default_priority: 20
  strict_preflight: true

# The launcher/preflight requires an explicit value for this gate:
#   LTX_IMAGENET_LT_GATE=access          # run on ACCESS
#   LTX_IMAGENET_LT_GATE=main_complete  # only after the CIFAR main table is full
secondary_gate:
  main_config: configs/native_cifar100_if100.yaml

repositories:
  t2h_unified:
    url: https://github.com/MediaBrain-SJTU/OC_LT.git
    commit: ced184378e8dc784958b6e14fd687781babd836d
    directory: T2H-unified

common_train: &common_train
  total_steps: 300000
  # The common host uses an inclusive 300000 update endpoint for both rows;
  # this is a protocol setting, not a native-loop compatibility quirk.
  inclusive_final_step: true
  batch_size: 256
  lr: 0.0002
  warmup: 5000
  T: 1000
  beta_1: 0.0001
  beta_T: 0.02
  var_type: fixedlarge
  dropout: 0.1
  grad_clip: 1.0
  num_workers: 8
  save_step: 50000
  sample_step: 100000
  ch: 128
  ch_mult: [1, 2, 2, 2]
  attn: [1]
  num_res_blocks: 2
  ema_decay: 0.9999
  conditional: true
  cfg: true
  checkpoint_prefix: ckpt_unified_v2_

common_eval: &common_eval
  checkpoint_step: 300000
  num_images: 50000
  sample_batch_size: 64
  inception_batch_size: 16
  guidance_scale: 1.5
  sample_method: ddim
  ddim_skip_step: 10
  uniform_labels: true
  sampler_family: ddim_100
  artifact_namespace: t2h_unified_v2
  metric_protocol: imagenet_lt_secondary_v1
  paper_metrics: true
  metrics_file: metrics.imagenet.json
  kid_repeats: 2

stages:
  # Both rows use the same T2H/OC_LT host.  Only the objective dispatch changes;
  # the published ImageNet-LT train manifest remains the data source of truth.
  - name: imagenet_lt_64_ddpm_secondary
    adapter: t2h_unified
    priority: 20
    dataset:
      name: imagenet_lt_64
      data_type: imagenet_lt
      root: ${LTX_IMAGENET_ROOT:-}
      manifest: ${LTX_IMAGENET_LT_TRAIN_MANIFEST:-}
      reference_manifest: ${LTX_IMAGENET_LT_REFERENCE_MANIFEST:-}
      num_class: 1000
      num_classes: 1000
      img_size: 64
    train: *common_train
    eval: *common_eval
    methods:
      - name: ddpm
        upstream_method: oc
        config_overrides:
          transfer:
            transfer_x0: false
    seeds: [0]
    tags: [imagenet-lt, 64x64, secondary, access-only, ddpm, seed-0, 300k]

  - name: imagenet_lt_64_ccua_secondary
    adapter: t2h_unified
    priority: 20
    dataset:
      name: imagenet_lt_64
      data_type: imagenet_lt
      root: ${LTX_IMAGENET_ROOT:-}
      manifest: ${LTX_IMAGENET_LT_TRAIN_MANIFEST:-}
      reference_manifest: ${LTX_IMAGENET_LT_REFERENCE_MANIFEST:-}
      num_class: 1000
      num_classes: 1000
      img_size: 64
    train: *common_train
    eval: *common_eval
    methods:
      - name: ccua
        objective: ccua
        ccua_al: 1.0
        ccua_ucl: 1.0
    seeds: [0]
    tags: [imagenet-lt, 64x64, secondary, access-only, ccua, seed-0, 300k]

aggregation:
  enabled: false
