# Two-arm, non-paper smoke continuation.  Both arms start from the exact same
# native DDPM checkpoint and differ only in the corrected response term.
#
# This is intentionally a separate campaign from unified_cifar_c100_t2h_v1:
# the imported native checkpoint has no T2H provenance, and this 20k-update
# diagnostic must never be mistaken for a from-scratch 300k benchmark row.
campaign:
  name: ipsvt_response_smoke_c100_if100_from_ddpm200k_v1
  description: "C100-LT IF100 seed-0: native DDPM 200k -> T2H corrected IP-SVT 220k smoke"
  protocol: ipsvt_response_smoke_v1
  server_config: configs/server.yaml
  paired_seeds: [0]
  default_priority: 100
  strict_preflight: true

smoke_continuation:
  source_checkpoint: "${LTX_DDPM_NATIVE_CKPT:-runs/unified_cifar_c100_v1/c100_if100_core/ddpm/seed_0/ckpt_200000.pt}"
  source_step: 200000
  target_step: 220000
  continuation_updates: 20000
  import_policy: "explicit --import_checkpoint + --allow_legacy_resume; strict model/EMA key compatibility; fresh optimizer/scheduler"
  not_a_paper_result: true

repositories:
  t2h_unified:
    url: https://github.com/MediaBrain-SJTU/OC_LT.git
    commit: ced184378e8dc784958b6e14fd687781babd836d
    directory: T2H-unified

common_train: &common_train
  # The host runs range(start, total_steps); with an imported step 200000 and
  # inclusive_final_step true, 220001 means updates 200001..220000 exactly.
  total_steps: 220000
  inclusive_final_step: true
  batch_size: 64
  lr: 0.0002
  warmup: 5000
  T: 1000
  beta_1: 0.0001
  beta_T: 0.02
  var_type: fixedlarge
  dropout: 0.1
  grad_clip: 1.0
  num_workers: 4
  ema_decay: 0.9999
  save_step: 20000
  sample_step: 0
  ch: 128
  ch_mult: [1, 2, 2, 2]
  attn: [1]
  num_res_blocks: 2
  conditional: true
  cfg: true
  amp: false
  checkpoint_prefix: ckpt_unified_v2_

common_eval: &common_eval
  checkpoint_step: 220000
  # The launcher defaults to 20k. It alone may lower this to 10k after its
  # explicit disk/GPU guard; the actual count is recorded in sample provenance.
  num_images: "${LTX_IPSVT_SMOKE_NUM_IMAGES:-20000}"
  sample_batch_size: 64
  guidance_scale: 1.5
  uniform_labels: true
  sample_method: ddim
  ddim_skip_step: 20  # T=1000 / 20 = DDIM-50
  metric_protocol: unified_cifar_v1
  paper_metrics: true
  artifact_namespace: t2h_unified_v2
  metrics_file: metrics.unified.v2.json
  kid: true
  kid_subsets: 100
  kid_subset_size: 1000
  kid_seed: 2026
  vgg_batch_size: 128
  knn_query_batch: 1024

stages:
  - name: c100_if100_response_smoke
    adapter: t2h_unified
    dataset:
      name: cifar100lt_if100
      data_type: cifar100lt
      imbalance_factor: 0.01
      split_seed: 0
      num_class: 100
      root: "${LTX_DATA_ROOT:-./data}"
    train: *common_train
    eval: *common_eval
    methods:
      # These flags select ipsvt_mode=response. They never route through the
      # legacy class-uniform ipsvt_aux implementation or its full/twin/clean
      # modes. eta is a perturbation scale; ipsvt_lambda is the only loss weight.
      - name: ipsvt_response_twin
        import_checkpoint: "${LTX_DDPM_NATIVE_CKPT:-runs/unified_cifar_c100_v1/c100_if100_core/ddpm/seed_0/ckpt_200000.pt}"
        import_checkpoint_step: 200000
        coral_projection_dim: 128
        ipsvt_response_variant: twin
        ipsvt_response_eta: 0.05
        ipsvt_lambda: 1.0
      - name: ipsvt_response_full
        import_checkpoint: "${LTX_DDPM_NATIVE_CKPT:-runs/unified_cifar_c100_v1/c100_if100_core/ddpm/seed_0/ckpt_200000.pt}"
        import_checkpoint_step: 200000
        coral_projection_dim: 128
        ipsvt_response_variant: full
        ipsvt_response_eta: 0.05
        ipsvt_lambda: 1.0
    seeds: [0]
    tags: [smoke, c100lt, if100, seed0, response-ipsvt, native-import]

aggregation: {enabled: false}
