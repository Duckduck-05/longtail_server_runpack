campaign:
  name: deadline_full_v2
  description: "Decisive semantic-mass gate plus same-backbone controls and official strong baselines"
  server_config: configs/server.yaml
  paired_seeds: [0, 1, 2]
  default_priority: 50
  strict_preflight: true

repositories:
  coral:
    url: https://github.com/SankarLab/coral-lt-diffusion.git
    branch: main
    directory: coral-lt-diffusion
    patch: patches/apply_coral_weighted_sampler.py
  oc:
    url: https://github.com/MediaBrain-SJTU/OC_LT.git
    branch: main
    directory: OC_LT
    patch: patches/apply_oc_seed_patch.py
  cm:
    url: https://github.com/Feng-Hong/ImbDiff-CM.git
    branch: main
    directory: ImbDiff-CM
  cbdm:
    url: https://github.com/qym7/CBDM-pytorch.git
    branch: main
    directory: CBDM-pytorch

shared_backbone:
  adapter: coral
  train:
    lr: 0.0002
    batch_size: 128
    total_steps: 150000
    save_step: 50000
    sample_step: 10000
    eval_step: 0
    T: 1000
    dropout: 0.1
    amp: true
    cfg: true
    conditional: true
    num_workers: 8
  eval:
    checkpoint_step: 150000
    num_images: 50000
    sample_method: cfg
    guidance_scales: [0.8]
    prd: true
    improved_prd: true
    standard_metrics: true

stages:
  # Highest priority. Every arm uses replacement sampling; LT uses uniform weights on the
  # exact frozen manifest so the only intended intervention is the supplied empirical measure.
  - name: decisive_semantic_gate
    enabled: true
    priority: 100
    adapter: coral
    dataset:
      name: c100_semantic_locked
      data_type: cifar100lt
      imbalance_factor: 0.01
      root: ${LTX_DATA_ROOT:-./data}
      frozen_manifest: ${LTX_SEMANTIC_MANIFEST:-}
      sample_order_contract: contracts/weight_manifest.schema.json
    semantic_eval_command: ${LTX_SEMANTIC_EVAL_COMMAND:-}
    methods:
      - name: lt
        generated_weight: uniform_manifest
      - name: oracle
        weight_file: ${LTX_WEIGHT_ORACLE:-}
      - name: predictive
        weight_file: ${LTX_WEIGHT_PREDICTIVE:-}
      - name: pointfit
        weight_file: ${LTX_WEIGHT_POINTFIT:-}
      - name: permutation
        weight_file: ${LTX_WEIGHT_PERMUTATION:-}
      - name: random_group
        enabled_if_present: true
        weight_file: ${LTX_WEIGHT_RANDOM_GROUP:-}
    seeds: [0, 1, 2]
    eval:
      guidance_scales: [0.8]
      standard_metrics: false
      prd: false
      improved_prd: false
    tags: [critical, same-backbone, semantic-mass, controlled]

  - name: simple_controls_cifar10lt
    enabled: true
    priority: 85
    adapter: coral
    dataset:
      name: cifar10lt_ir100
      data_type: cifar10lt
      imbalance_factor: 0.01
      root: ${LTX_DATA_ROOT:-./data}
    methods:
      - name: ddpm
      - name: class_balanced
        generated_weight: inverse_class_frequency
      - name: sqrt_resampling
        generated_weight: sqrt_inverse_class_frequency
      - name: ada
        flags: [--augm]
      - name: cbdm
        flags: [--cb, --tau=1.0]
      - name: coral
        flags: [--supcon, --supcon_weight=0.5, --supcon_temp=0.1, --temperature_scaling=0.3]
    seeds: [0, 1, 2]
    eval:
      guidance_scales: [1.0]
    tags: [same-backbone, cifar10lt, ir100]

  - name: simple_controls_cifar100lt
    enabled: true
    priority: 75
    adapter: coral
    dataset:
      name: cifar100lt_ir100
      data_type: cifar100lt
      imbalance_factor: 0.01
      root: ${LTX_DATA_ROOT:-./data}
    methods:
      - name: ddpm
      - name: class_balanced
        generated_weight: inverse_class_frequency
      - name: sqrt_resampling
        generated_weight: sqrt_inverse_class_frequency
      - name: ada
        flags: [--augm]
      - name: cbdm
        flags: [--cb, --tau=1.0]
      - name: coral
        flags: [--supcon, --supcon_weight=0.5, --supcon_temp=0.1, --temperature_scaling=0.3]
    seeds: [0, 1, 2]
    eval:
      guidance_scales: [0.8]
    tags: [same-backbone, cifar100lt, ir100]

  - name: official_oriented_calibration
    enabled: true
    priority: 65
    adapter: oc
    dataset:
      name: cifar10lt_ir100
      data_type: cifar10lt
      imbalance_factor: 0.01
      num_class: 10
      root: ${LTX_DATA_ROOT:-./data}
    methods:
      - name: t2h
    seeds: [0, 1, 2]
    train:
      total_steps: 200000
      save_step: 100000
      sample_step: 10000
      batch_size: 128
    eval:
      checkpoint_step: 200000
      num_images: 50000
      guidance_scale: 1.5
      ddim_skip_step: 10
    tags: [official-repo, t2h, cifar10lt, ir100]

  - name: official_capacity_manipulation
    enabled: true
    priority: 60
    adapter: cm
    dataset:
      name: cifar100lt_ir100
      data_type: cifar100lt
      imbalance_factor: 0.01
      root: ${LTX_DATA_ROOT:-./data}
    methods:
      - name: cm
    seeds: [0, 1, 2]
    train:
      total_steps: 300001
      batch_size: 64
    eval:
      checkpoint_step: 300000
      num_images: 50000
    tags: [official-repo, capacity-manipulation, cifar100lt, ir100]

aggregation:
  enabled: true
  depends_on_all_enabled_tasks: true
  semantic_primary_stage: decisive_semantic_gate
  baseline_arm: lt
  oracle_arm: oracle
  inferred_arm: predictive
  permutation_arm: permutation
  pointfit_arm: pointfit
  bootstrap_repetitions: 10000
  confidence_level: 0.95
  require_bootstrap_draws: true
  noninferiority:
    coarse_consistency_absolute_drop: 0.01
    fid_relative_increase: 0.05
    kid_relative_increase: 0.10
    recall_absolute_drop: 0.01
    head_fid_relative_increase: 0.05
    memorization_absolute_increase: 0.01
