# CM ImageNet-LT port.  Model/loss parameters are the released CM defaults;
# the public CM repository contains no author-provided ImageNet-LT config.
method: cm
seed: 0
output_dir: outputs/cm_imagenet_lt
dataset:
  name: imagenet_lt
  root: ""
  manifest: ""
  img_size: 64
  num_classes: 1000
  download: false
model:
  ch: 128
  ch_mult: [1, 2, 2, 2]
  attn: [1]
  num_res_blocks: 2
  dropout: 0.1
  conditional: true
diffusion:
  beta_1: 0.0001
  beta_T: 0.02
  T: 1000
  var_type: fixedlarge
transfer:
  transfer_x0: true
  transfer_tr_tau: false
  transfer_mode: t2h
  tr_tau: 1.0
cm:
  lora_r: 0.0
  lora_alpha: 1.0
  lora_scaling: 0.5
  lora_r_ratio: 0.1
  lora_mode: ratio
  lora_part: [up]
  w_con: 1.0
  w_div: 0.2
training:
  lr: 0.0002
  grad_clip: 1.0
  warmup: 5000
  batch_size: 64
  num_workers: 8
  total_steps: 300001
  ema_decay: 0.9999
  cfg: true
  sample_size: 64
  sample_step: 10000
  save_step: 100000
evaluation:
  image_dir: outputs/cm_imagenet_lt/generated-ckpt-300000
  num_images: 50000
  batch_size: 256
  omega: 1.5
  sample_method: ddim
  ddim_skip_step: 20
