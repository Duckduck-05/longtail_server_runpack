seed: 0
output_dir: outputs/CIFAR100_LT_imb0.005_baseline_LALoss_ResNet_s-resnet20_bs128_ep200_lr0.1_SGD_multistep_seed0

dataset:
  root: ./data
  name: CIFAR100_LT
  imb_factor: 0.005
  rand_number: 0
  download: true

model:
  type: ResNet_s
  params:
    m_type: resnet20
    num_classes: 100
    use_norm: true

training:
  num_epochs: 200
  num_workers: 4
  batch_size: 128
  loss_type: LALoss
  loss_params:
    tau: 1.0
    LA_epoch: -1
  optimizer: SGD
  optim_params:
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler: multistep
  scheduler_params:
    gamma: 0.1
    milestones: [120, 160]

logging:
  print_iter: 100
