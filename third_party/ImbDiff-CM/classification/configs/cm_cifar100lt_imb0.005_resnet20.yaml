seed: 0
output_dir: outputs/CIFAR100_LT_imb0.005_baseline_CMLoss_ResNet_s_CM-resnet20_bs128_ep200_lr0.1_SGD_multistep_seed0

dataset:
  root: ./data
  name: CIFAR100_LT
  imb_factor: 0.005
  rand_number: 0
  download: true

model:
  type: ResNet_s_CM
  params:
    m_type: resnet20
    num_classes: 100
    use_norm: true
    r: 4
    lora_alpha: 4
    lora_list: [true, true, true, true, true]
    r_ratio: 0.15
    lora_mode: ratio
    scaling: 0.8

training:
  num_epochs: 200
  num_workers: 4
  batch_size: 128
  loss_type: CMLoss
  loss_params:
    tau: 1.0
    LA_epoch: -1
    alpha: 1.0
    T: 1.5
    w_div: 1.0
  optimizer: SGD
  optim_params:
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler: multistep
  scheduler_params:
    gamma: 0.1
    milestones: [120, 160]

logging:
  print_iter: 100
