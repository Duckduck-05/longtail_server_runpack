# Unified Benchmark v1 — common T2H-host comparison protocol.
#
# This is deliberately *not* a merged reproduction of any paper table.  All
# rows train from scratch on the same three public CIFAR-LT cells, use exactly
# the same three seeds and update budget, generate 50k class-uniform samples,
# and execute on one T2H/OC_LT host. Method-specific losses are faithful ports
# selected by objective dispatch; native repositories are provenance/archive
# inputs, not runtime dependencies.
campaign:
  name: unified_cifar_t2h_v1
  description: "Fair common-host comparison: DDPM, CBDM, T2H, CM, CORAL, CCUA"
  protocol: unified_cifar_v1
  server_config: configs/server.yaml
  paired_seeds: [0, 1, 2]
  default_priority: 100
  strict_preflight: true

fairness_contract:
  cells: [cifar10lt_if100, cifar10lt_if1000, cifar100lt_if100]
  methods: [ddpm, cbdm, t2h, cm, coral, ccua]
  seeds: [0, 1, 2]
  # 300k x batch 64 = 19.2M images seen, which is exactly the data budget of
  # CBDM (300k x 64), CM (300k x 64) and CORAL (150k x 128). At the previous
  # 200k (12.8M) both CBDM and CM ran below their own papers' design point
  # while CORAL ran above its: undertraining two baselines is a fairness
  # violation in a way that a uniform surplus is not.
  train_updates: 300000
  train_batch_size: 64
  learning_rate: 0.0002
  diffusion_steps: 1000
  beta_1: 0.0001
  beta_T: 0.02
  var_type: fixedlarge
  grad_clip: 1.0
  generated_images: 50000
  guidance_scale: 1.5
  checkpoint_prefix: ckpt_unified_v2_
  artifact_namespace: t2h_unified_v2
  # The native repositories are audited for objective ports, but the active
  # benchmark uses this pinned T2H host. A source/flag drift must not silently
  # make the comparison apples-to-oranges while preflight still passes.
  unet_ch: 128
  unet_ch_mult: [1, 2, 2, 2]
  unet_attn: [1]
  unet_num_res_blocks: 2
  ema_decay: 0.9999
  conditional_label_schedule: cyclic_class_uniform
  sampler_family: ddim_100
  metric_protocol: unified_cifar_v1
  host_revision: t2h-unified-common-v2

repositories:
  t2h_unified:
    url: https://github.com/MediaBrain-SJTU/OC_LT.git
    commit: ced184378e8dc784958b6e14fd687781babd836d
    directory: T2H-unified

# Every objective receives these exact settings on the common host.
common_train: &common_train
  total_steps: 300000
  inclusive_final_step: true
  batch_size: 64
  lr: 0.0002
  warmup: 5000
  T: 1000
  beta_1: 0.0001
  beta_T: 0.02
  var_type: fixedlarge
  dropout: 0.1
  grad_clip: 1.0
  num_workers: 4
  # Checkpoints are retained under this namespace for exact restart/audit:
  # a job that dies at 280k can resume from 250k rather than 200k. Legacy and
  # native checkpoint names are never selected by the common adapter.
  save_step: 50000
  sample_step: 100000
  ch: 128
  ch_mult: [1, 2, 2, 2]
  attn: [1]
  num_res_blocks: 2
  ema_decay: 0.9999
  conditional: true
  cfg: true
  amp: false
  checkpoint_prefix: ckpt_unified_v2_

common_eval: &common_eval
  checkpoint_step: 300000
  num_images: 50000
  sample_batch_size: 64
  guidance_scale: 1.5
  uniform_labels: true
  sampler_family: ddim_100
  sample_method: ddim
  ddim_skip_step: 10
  metric_protocol: unified_cifar_v1
  paper_metrics: true
  artifact_namespace: t2h_unified_v2
  metrics_file: metrics.unified.v2.json
  # KID uses the CM cubic-kernel estimator over the same pinned Inception
  # features/reference as FID.  The seed controls only its subset draws.
  kid: true
  kid_subsets: 100
  kid_subset_size: 1000
  kid_seed: 2026
  # This creates an auxiliary tail breakdown, not a second main-table metric.
  # It contains per-class FID plus CM's Many/Medium/Few class groups.
  per_class_metrics_file: metrics.per_class.v2.json
  longtail_groups: cm_three_way

# CCUA = alignment loss + unsupervised contrastive loss. The weights are
# 1.0/1.0 because that is the only configuration upstream ships for its U-Net
# pipeline; the paper's 0.05/0.05 is tuned for the DiT/SiT ImageNet-LT pipeline,
# whose latent-space loss scales are not comparable. Batch resample stays off:
# the paper applies it to ImageNet-LT/TinyImageNet-LT and states explicitly that
# it is not used on CIFAR-LT.
ccua_method: &ccua_method
  name: ccua
  ccua_al: 1.0
  ccua_ucl: 1.0
  brs: false

stages:
  - name: c10_if100_core
    adapter: t2h_unified
    dataset: {name: cifar10lt_if100, data_type: cifar10lt, imbalance_factor: 0.01, split_seed: 0, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods:
      - {name: ddpm}
      - {name: cbdm, flags: [--cb, --tau=1.0]}
      - {name: coral, coral_projection_dim: 128, flags: [--supcon, --supcon_weight=0.01, --supcon_temp=0.12, --temperature_scaling=0.8]}
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar10lt, if100, core]
  - name: c10_if100_t2h
    adapter: t2h_unified
    dataset: {name: cifar10lt_if100, data_type: cifar10lt, imbalance_factor: 0.01, split_seed: 0, num_class: 10, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods: [{name: t2h}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar10lt, if100, t2h]
  - name: c10_if100_cm
    adapter: t2h_unified
    dataset: {name: cifar10lt_if100, data_type: cifar10lt, imbalance_factor: 0.01, split_seed: 0, num_classes: 10, img_size: 32, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods: [{name: cm, upstream_method: cm}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar10lt, if100, cm]
  - name: c10_if100_ccua
    adapter: t2h_unified
    dataset: {name: cifar10lt_if100, data_type: cifar10lt, imbalance_factor: 0.01, split_seed: 0, num_class: 10, img_size: 32, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods: [*ccua_method]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar10lt, if100, ccua]

  - name: c10_if1000_core
    adapter: t2h_unified
    dataset: {name: cifar10lt_if1000, data_type: cifar10lt, imbalance_factor: 0.001, split_seed: 0, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods:
      - {name: ddpm}
      - {name: cbdm, flags: [--cb, --tau=1.0]}
      - {name: coral, coral_projection_dim: 128, flags: [--supcon, --supcon_weight=0.01, --supcon_temp=0.10, --temperature_scaling=1.0]}
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar10lt, if1000, core]
  - name: c10_if1000_t2h
    adapter: t2h_unified
    dataset: {name: cifar10lt_if1000, data_type: cifar10lt, imbalance_factor: 0.001, split_seed: 0, num_class: 10, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods: [{name: t2h}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar10lt, if1000, t2h]
  - name: c10_if1000_cm
    adapter: t2h_unified
    dataset: {name: cifar10lt_if1000, data_type: cifar10lt, imbalance_factor: 0.001, split_seed: 0, num_classes: 10, img_size: 32, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods: [{name: cm, upstream_method: cm}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar10lt, if1000, cm]
  - name: c10_if1000_ccua
    adapter: t2h_unified
    dataset: {name: cifar10lt_if1000, data_type: cifar10lt, imbalance_factor: 0.001, split_seed: 0, num_class: 10, img_size: 32, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods: [*ccua_method]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar10lt, if1000, ccua]

  - name: c100_if100_core
    adapter: t2h_unified
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods:
      - {name: ddpm}
      - {name: cbdm, flags: [--cb, --tau=1.0]}
      - {name: coral, coral_projection_dim: 128, flags: [--supcon, --supcon_weight=0.01, --supcon_temp=0.09, --temperature_scaling=1.0]}
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, core]
  - name: c100_if100_t2h
    adapter: t2h_unified
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, num_class: 100, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods: [{name: t2h}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, t2h]
  - name: c100_if100_cm
    adapter: t2h_unified
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, num_classes: 100, img_size: 32, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods: [{name: cm, upstream_method: cm}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, cm]
  - name: c100_if100_ccua
    adapter: t2h_unified
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, num_class: 100, img_size: 32, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods: [*ccua_method]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, ccua]

aggregation: {enabled: false}
