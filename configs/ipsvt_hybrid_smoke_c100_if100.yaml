# Isolated diagnostic continuation for the natural-batch hybrid IP-SVT mode.
# It intentionally does not share a run directory, config, or mode with the
# existing response smoke.  Imported native weights make this non-paper only.
campaign:
  name: ipsvt_hybrid_smoke_c100_if100_from_ddpm200k_v1
  description: "C100-LT IF100 seed-0: native DDPM 200k -> T2H hybrid IP-SVT 220k diagnostic"
  protocol: ipsvt_hybrid_smoke_v1
  server_config: configs/server.yaml
  paired_seeds: [0]
  default_priority: 100
  strict_preflight: true

smoke_continuation:
  source_checkpoint: "${LTX_DDPM_NATIVE_CKPT:-runs/unified_cifar_c100_v1/c100_if100_core/ddpm/seed_0/ckpt_200000.pt}"
  source_step: 200000
  target_step: 220000
  continuation_updates: 20000
  import_policy: "explicit --import_checkpoint + --allow_legacy_resume; strict model/EMA key compatibility; fresh optimizer/scheduler; manifest records source path/SHA-256/step"
  diagnostic: true
  not_a_paper_result: true

repositories:
  t2h_unified:
    url: https://github.com/MediaBrain-SJTU/OC_LT.git
    commit: ced184378e8dc784958b6e14fd687781babd836d
    directory: T2H-unified

common_train: &common_train
  # The host iterates range(start, total_steps).  Importing completed step
  # 200000 and setting this bound to 220001 runs updates 200001..220000: 20k.
  total_steps: 220000
  inclusive_final_step: true
  batch_size: 64
  lr: 0.0002
  warmup: 5000
  T: 1000
  beta_1: 0.0001
  beta_T: 0.02
  var_type: fixedlarge
  dropout: 0.1
  grad_clip: 1.0
  num_workers: 4
  ema_decay: 0.9999
  save_step: 5000
  sample_step: 0
  ch: 128
  ch_mult: [1, 2, 2, 2]
  attn: [1]
  num_res_blocks: 2
  conditional: true
  cfg: true
  amp: false
  checkpoint_prefix: ckpt_unified_v2_

common_eval: &common_eval
  checkpoint_step: 220000
  # Exactly 20k: this hybrid diagnostic intentionally has no 10k guard
  # fallback, so sample provenance is directly comparable within the pilot.
  num_images: 20000
  sample_batch_size: 64
  guidance_scale: 1.5
  uniform_labels: true
  sample_method: ddim
  ddim_skip_step: 20  # T=1000 / 20 = DDIM-50
  metric_protocol: unified_cifar_v1
  # Detailed unified evaluation is required for IS/PRD, VGG Precision/Recall,
  # and Many/Medium/Few FID. KID is explicitly disabled for this diagnostic.
  paper_metrics: true
  metrics_mode: detailed
  artifact_namespace: t2h_unified_v2
  metrics_file: metrics.quick.unified.v2.json
  per_class_metrics_file: metrics.quick.per_class.v2.json
  longtail_groups: cm_three_way
  kid: false
  vgg_batch_size: 128
  knn_query_batch: 1024

stages:
  - name: c100_if100_hybrid_smoke
    adapter: t2h_unified
    dataset:
      name: cifar100lt_if100
      data_type: cifar100lt
      imbalance_factor: 0.01
      split_seed: 0
      num_class: 100
      root: "${LTX_DATA_ROOT:-./data}"
    train: *common_train
    eval: *common_eval
    methods:
      # `hybrid` is an in-graph natural-loader objective. It has no legacy
      # IPSVTAuxiliary sampler, ipsvt_every gate, ipsvt_batch, tail weighting,
      # transfer target, or routing path. The host base loss is sole DDPM.
      - name: ipsvt_hybrid
        import_checkpoint: "${LTX_DDPM_NATIVE_CKPT:-runs/unified_cifar_c100_v1/c100_if100_core/ddpm/seed_0/ckpt_200000.pt}"
        import_checkpoint_step: 200000
        coral_projection_dim: 128
        ipsvt_K: 4
        ipsvt_delta: 0.1
        ipsvt_s: 0.05
        ipsvt_tau: 0.000001
        ipsvt_lambda_aux: 1.0
        ipsvt_lambda_svt: 1.0
        ipsvt_hybrid_chunk: 16
    seeds: [0]
    tags: [smoke, diagnostic, non-paper, c100lt, if100, seed0, ipsvt-hybrid, native-import]

aggregation: {enabled: false}
