# CIFAR-100-LT-only subset of the Unified Benchmark v1 protocol.
#
# Same shared_backbone/train/eval settings, repositories, and fairness rules
# as configs/unified_cifar.yaml -- this file only narrows the fairness
# contract's `cells` to cifar100lt_if100 and disables the cifar10lt stages,
# so it is a separate, self-consistent campaign (own name, own state.sqlite)
# rather than an edit to the locked 54-task unified_cifar_v1 contract.
campaign:
  name: unified_cifar_c100_t2h_v1
  description: "CIFAR-100-LT-only run: DDPM, CBDM, T2H, CM, CORAL, CCUA, IP-SVT (+ two IP-SVT ablation arms)"
  protocol: unified_cifar_v1
  server_config: configs/server.yaml
  paired_seeds: [0, 1, 2]
  default_priority: 100
  strict_preflight: true

fairness_contract:
  cells: [cifar100lt_if100]
  methods: [ddpm, cbdm, t2h, cm, coral, ccua, ipsvt, ipsvt_twin, ipsvt_clean]
  seeds: [0, 1, 2]
  train_updates: 300000
  train_batch_size: 64
  learning_rate: 0.0002
  diffusion_steps: 1000
  beta_1: 0.0001
  beta_T: 0.02
  var_type: fixedlarge
  grad_clip: 1.0
  generated_images: 50000
  guidance_scale: 1.5
  checkpoint_prefix: ckpt_unified_v2_
  artifact_namespace: t2h_unified_v2
  unet_ch: 128
  unet_ch_mult: [1, 2, 2, 2]
  unet_attn: [1]
  unet_num_res_blocks: 2
  ema_decay: 0.9999
  conditional_label_schedule: cyclic_class_uniform
  # DDIM with 100 steps, shared by every method. The point of normalising the
  # sampler is that all methods use the SAME one, not that it is ancestral: the
  # previous 1000-step setting cost twenty times as much as anything these
  # papers actually run. OC_LT and CCUA both default to skip=10 (=100 steps);
  # ImbDiff-CM's CIFAR-100-LT config uses skip=20. 100 is the majority default
  # and the extra ~19 GPU-hours over 50 steps is immaterial next to training.
  # omega 1.5 follows OC_LT's published sampling command (--w 1.5) and
  # ImbDiff-CM's cifar100lt_ir100 config (omega: 1.5).
  sampler_family: ddim_100
  metric_protocol: unified_cifar_v1
  host_revision: t2h-unified-common-v2

repositories:
  # All benchmark rows execute from this OC_LT/T2H host. The original
  # repositories are recorded in THIRD_PARTY_MANIFEST.json and the archive,
  # but are not runtime dependencies of this campaign.
  t2h_unified:
    url: https://github.com/MediaBrain-SJTU/OC_LT.git
    commit: ced184378e8dc784958b6e14fd687781babd836d
    directory: T2H-unified

common_train: &common_train
  total_steps: 300000
  inclusive_final_step: true
  batch_size: 64
  lr: 0.0002
  warmup: 5000
  T: 1000
  beta_1: 0.0001
  beta_T: 0.02
  var_type: fixedlarge
  dropout: 0.1
  grad_clip: 1.0
  num_workers: 4
  save_step: 50000
  sample_step: 100000
  ch: 128
  ch_mult: [1, 2, 2, 2]
  attn: [1]
  num_res_blocks: 2
  ema_decay: 0.9999
  conditional: true
  cfg: true
  amp: false
  checkpoint_prefix: ckpt_unified_v2_

common_eval: &common_eval
  checkpoint_step: 300000
  num_images: 50000
  sample_batch_size: 64
  guidance_scale: 1.5
  uniform_labels: true
  sampler_family: ddim_100
  sample_method: ddim
  ddim_skip_step: 10
  metric_protocol: unified_cifar_v1
  paper_metrics: true
  artifact_namespace: t2h_unified_v2
  metrics_file: metrics.unified.v2.json
  kid: true
  kid_subsets: 100
  kid_subset_size: 1000
  kid_seed: 2026
  # Runtime-only evaluator tuning; metric definition and sample count are unchanged.
  vgg_batch_size: 128
  knn_query_batch: 1024
  per_class_metrics_file: metrics.per_class.v2.json
  longtail_groups: cm_three_way

stages:
  - name: c100_if100_core
    adapter: t2h_unified
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval}
    methods:
      - {name: ddpm}
      - {name: cbdm, flags: [--cb, --tau=1.0]}
      - {name: coral, coral_projection_dim: 128, flags: [--supcon, --supcon_weight=0.01, --supcon_temp=0.09, --temperature_scaling=1.0]}
      # IP-SVT and its two ablation arms run this stage's own trainer with extra
      # flags, so they share the ddpm baseline's data pipeline, schedule,
      # sampler and metric path exactly. lambda_SVT is frozen at 1; the pilot
      # cleared all four preregistered criteria there and sweeping it inside the
      # headline comparison would be hyperparameter selection on the test table.
      #
      #   ipsvt_clean  class-uniform DDPM auxiliary, no condition perturbation.
      #                Attribution control: rules out the possibility that tail
      #                gains come from tail classes simply receiving extra
      #                auxiliary updates rather than from the mechanism.
      #   ipsvt_twin   twin-condition DDPM only (lambda_SVT = 0).
      #   ipsvt        the method: twin + response-geometry transfer.
      - {name: ipsvt_clean, flags: [--ipsvt, --ipsvt_mode=clean, --ipsvt_batch=16]}
      - {name: ipsvt_twin, flags: [--ipsvt, --ipsvt_mode=twin, --ipsvt_batch=16, --ipsvt_lambda_svt=0.0]}
      - {name: ipsvt, flags: [--ipsvt, --ipsvt_mode=full, --ipsvt_batch=16, --ipsvt_lambda_svt=1.0]}
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, core]
  - name: c100_if100_t2h
    adapter: t2h_unified
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, num_class: 100, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval, sample_method: ddim, ddim_skip_step: 10}
    methods: [{name: t2h}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, t2h]
  - name: c100_if100_cm
    adapter: t2h_unified
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, num_classes: 100, img_size: 32, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval, sample_method: ddim, ddim_skip_step: 10}
    methods: [{name: cm, upstream_method: cm}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, cm]
  # CCUA = alignment loss + unsupervised contrastive loss. `ccua_al`/`ccua_ucl`
  # are 1.0/1.0 because that is the only configuration upstream ships for its
  # U-Net pipeline; the paper's 0.05/0.05 is tuned for the DiT/SiT ImageNet-LT
  # pipeline, whose latent-space loss scales are not comparable. Batch resample
  # stays off: the paper applies it to ImageNet-LT/TinyImageNet-LT and states it
  # is not used on CIFAR-LT.
  - name: c100_if100_ccua
    adapter: t2h_unified
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, num_class: 100, img_size: 32, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval, sample_method: ddim, ddim_skip_step: 10}
    methods: [{name: ccua, ccua_al: 1.0, ccua_ucl: 1.0, brs: false}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, ccua]

aggregation: {enabled: false}
