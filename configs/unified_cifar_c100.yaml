# CIFAR-100-LT-only subset of the Unified Benchmark v1 protocol.
#
# Same shared_backbone/train/eval settings, repositories, and fairness rules
# as configs/unified_cifar.yaml -- this file only narrows the fairness
# contract's `cells` to cifar100lt_if100 and disables the cifar10lt stages,
# so it is a separate, self-consistent campaign (own name, own state.sqlite)
# rather than an edit to the locked 54-task unified_cifar_v1 contract.
campaign:
  name: unified_cifar_c100_v1
  description: "CIFAR-100-LT-only run: DDPM, CBDM, T2H, CM, CORAL, CCUA"
  protocol: unified_cifar_v1
  server_config: configs/server.yaml
  paired_seeds: [0, 1, 2]
  default_priority: 100
  strict_preflight: true

fairness_contract:
  cells: [cifar100lt_if100]
  methods: [ddpm, cbdm, t2h, cm, coral, ccua]
  seeds: [0, 1, 2]
  train_updates: 300000
  train_batch_size: 64
  learning_rate: 0.0002
  diffusion_steps: 1000
  generated_images: 50000
  unet_ch: 128
  unet_ch_mult: [1, 2, 2, 2]
  unet_attn: [1]
  unet_num_res_blocks: 2
  ema_decay: 0.9999
  conditional_label_schedule: cyclic_class_uniform
  sampler_family: ancestral_ddpm
  metric_protocol: unified_cifar_v1

repositories:
  ccua:
    url: https://github.com/C-Fun/Contrastive-Conditional-Unconditional-Alignment-for-Long-tailed-Diffusion-Model.git
    commit: baff9def6cfd553d4452d10eab0bac66ec2727aa
    directory: CCUA-DDPM
  coral:
    url: https://github.com/SankarLab/coral-lt-diffusion.git
    commit: 62c9dfad2da13f5be0f28975e5cd36727c1acc7a
    directory: coral-lt-diffusion
  cbdm:
    url: https://github.com/qym7/CBDM-pytorch.git
    commit: 513f7fffe7369343499611a8f68212a8b40f11a1
    directory: CBDM-pytorch
  oc:
    url: https://github.com/MediaBrain-SJTU/OC_LT.git
    commit: ced184378e8dc784958b6e14fd687781babd836d
    directory: OC_LT
  cm:
    url: https://github.com/Feng-Hong/ImbDiff-CM.git
    commit: 04262d7efc4130fda551fa1a1a22d8d5af636899
    directory: ImbDiff-CM

common_train: &common_train
  total_steps: 300000
  inclusive_final_step: true
  batch_size: 64
  lr: 0.0002
  warmup: 5000
  T: 1000
  dropout: 0.1
  num_workers: 4
  save_step: 50000
  sample_step: 100000
  ch: 128
  ch_mult: [1, 2, 2, 2]
  attn: [1]
  num_res_blocks: 2
  ema_decay: 0.9999
  conditional: true
  cfg: true
  amp: false

common_eval: &common_eval
  checkpoint_step: 300000
  num_images: 50000
  sample_batch_size: 64
  guidance_scale: 1.0
  uniform_labels: true
  sampler_family: ancestral_ddpm
  metric_protocol: unified_cifar_v1
  paper_metrics: true
  metrics_file: metrics.unified.json
  kid: true
  kid_subsets: 100
  kid_subset_size: 1000
  kid_seed: 2026
  per_class_metrics_file: metrics.per_class.json
  longtail_groups: cm_three_way

stages:
  - name: c100_if100_core
    adapter: coral
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval, sample_method: cfg}
    methods:
      - {name: ddpm}
      - {name: cbdm, flags: [--cb, --tau=1.0]}
      - {name: coral, flags: [--supcon, --supcon_weight=0.01, --supcon_temp=0.09, --temperature_scaling=1.0]}
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, core]
  - name: c100_if100_t2h
    adapter: oc
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, num_class: 100, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval, sample_method: ddpm, ddim_skip_step: 1}
    methods: [{name: t2h}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, t2h]
  - name: c100_if100_cm
    adapter: cm
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, num_classes: 100, img_size: 32, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval, sample_method: ddpm, ddim_skip_step: 1}
    methods: [{name: cm, upstream_method: cm}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, cm]
  # CCUA = alignment loss + unsupervised contrastive loss. `ccua_al`/`ccua_ucl`
  # are 1.0/1.0 because that is the only configuration upstream ships for its
  # U-Net pipeline; the paper's 0.05/0.05 is tuned for the DiT/SiT ImageNet-LT
  # pipeline, whose latent-space loss scales are not comparable. Batch resample
  # stays off: the paper applies it to ImageNet-LT/TinyImageNet-LT and states it
  # is not used on CIFAR-LT.
  - name: c100_if100_ccua
    adapter: ccua
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, split_seed: 0, num_class: 100, img_size: 32, root: "${LTX_DATA_ROOT:-./data}"}
    train: *common_train
    eval: {<<: *common_eval, sample_method: ddpm, ddim_skip_step: 1}
    methods: [{name: ccua, ccua_al: 1.0, ccua_ucl: 1.0, brs: false}]
    seeds: [0, 1, 2]
    tags: [unified-cifar-v1, cifar100lt, if100, ccua]

aggregation: {enabled: false}
