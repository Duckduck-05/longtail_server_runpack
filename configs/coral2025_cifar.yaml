# Faithful CIFAR portion of CORAL (NeurIPS 2025, arXiv:2506.15933v2).
# The public CORAL/CBDM/OC sources cannot run the paper's CelebA-5 or
# ImageNet-LT protocols, so those two paper datasets are intentionally absent
# rather than silently approximated.  See AUDIT_CORAL2025.md.
campaign:
  name: coral2025_cifar_v1
  paper_protocol: coral2025_table1_cifar
  description: "CORAL Table-1 CIFAR reproduction: DDPM, CBDM, T2H, CORAL; 3 paired seeds"
  server_config: configs/server.yaml
  paired_seeds: [0, 1, 2]
  default_priority: 100
  strict_preflight: true

# See the CM config for the candidate-method hand-off contract.
comparison:
  candidate_method: ${LTX_CANDIDATE_METHOD:-}
  require_candidate_for_paper_claim: ${LTX_REQUIRE_CANDIDATE_FOR_PAPER_CLAIM:-false}
  bootstrap_repetitions: 10000
  confidence_level: 0.95

repositories:
  coral:
    url: https://github.com/SankarLab/coral-lt-diffusion.git
    commit: 62c9dfad2da13f5be0f28975e5cd36727c1acc7a
    directory: coral-lt-diffusion
    patch: patches/apply_coral_weighted_sampler.py
  cbdm:
    url: https://github.com/qym7/CBDM-pytorch.git
    commit: 513f7fffe7369343499611a8f68212a8b40f11a1
    directory: CBDM-pytorch
    patch: patches/apply_cbdm_metric_paths.py
  oc:
    url: https://github.com/MediaBrain-SJTU/OC_LT.git
    commit: ced184378e8dc784958b6e14fd687781babd836d
    directory: OC_LT
    patch: patches/apply_oc_seed_patch.py + patches/apply_oc_metric_weights_patch.py

shared_backbone:
  adapter: coral
  train:
    lr: 0.0002
    batch_size: 128
    total_steps: 150000
    save_step: 50000
    sample_step: 10000
    eval_step: 0
    T: 1000
    dropout: 0.1
    amp: true
    cfg: true
    conditional: true
    num_workers: 8
  eval:
    checkpoint_step: 150000
    num_images: 50000
    sample_method: cfg
    prd: false
    improved_prd: false
    standard_metrics: false
    paper_metrics: true

stages:
  - name: coral2025_c10_if100_core
    adapter: coral
    dataset:
      name: cifar10lt_if100
      data_type: cifar10lt
      imbalance_factor: 0.01
      root: ${LTX_DATA_ROOT:-./data}
    methods:
      - {name: ddpm, guidance_scale: 0.8}
      - {name: cbdm, guidance_scale: 1.0, flags: [--cb, --tau=1.0]}
      - {name: coral, guidance_scale: 0.6, flags: [--supcon, --supcon_weight=0.01, --supcon_temp=0.12, --temperature_scaling=0.8]}
    seeds: [0, 1, 2]
    tags: [coral2025, cifar10lt, if100, paper-table1]
  - name: coral2025_c10_if100_t2h
    adapter: oc
    dataset:
      name: cifar10lt_if100
      data_type: cifar10lt
      imbalance_factor: 0.01
      num_class: 10
      root: ${LTX_DATA_ROOT:-./data}
    train: {total_steps: 200000, batch_size: 128, save_step: 100000, sample_step: 10000}
    eval: {checkpoint_step: 200000, num_images: 50000, guidance_scale: 1.0, ddim_skip_step: 10, paper_metrics: true}
    methods: [{name: t2h, guidance_scale: 1.0}]
    seeds: [0, 1, 2]
    tags: [coral2025, cifar10lt, if100, paper-table1]

  - name: coral2025_c10_if1000_core
    adapter: coral
    dataset:
      name: cifar10lt_if1000
      data_type: cifar10lt
      imbalance_factor: 0.001
      root: ${LTX_DATA_ROOT:-./data}
    methods:
      - {name: ddpm, guidance_scale: 1.0}
      - {name: cbdm, guidance_scale: 1.8, flags: [--cb, --tau=1.0]}
      - {name: coral, guidance_scale: 1.0, flags: [--supcon, --supcon_weight=0.01, --supcon_temp=0.10, --temperature_scaling=1.0]}
    seeds: [0, 1, 2]
    tags: [coral2025, cifar10lt, if1000, paper-table1]
  - name: coral2025_c10_if1000_t2h
    adapter: oc
    dataset:
      name: cifar10lt_if1000
      data_type: cifar10lt
      imbalance_factor: 0.001
      num_class: 10
      root: ${LTX_DATA_ROOT:-./data}
    train: {total_steps: 200000, batch_size: 128, save_step: 100000, sample_step: 10000}
    eval: {checkpoint_step: 200000, num_images: 50000, guidance_scale: 1.7, ddim_skip_step: 10, paper_metrics: true}
    methods: [{name: t2h, guidance_scale: 1.7}]
    seeds: [0, 1, 2]
    tags: [coral2025, cifar10lt, if1000, paper-table1]

  - name: coral2025_c100_if100_core
    adapter: coral
    dataset:
      name: cifar100lt_if100
      data_type: cifar100lt
      imbalance_factor: 0.01
      root: ${LTX_DATA_ROOT:-./data}
    methods:
      - {name: ddpm, guidance_scale: 0.8}
      - {name: cbdm, guidance_scale: 1.6, flags: [--cb, --tau=1.0]}
      - {name: coral, guidance_scale: 0.8, flags: [--supcon, --supcon_weight=0.01, --supcon_temp=0.09, --temperature_scaling=1.0]}
    seeds: [0, 1, 2]
    tags: [coral2025, cifar100lt, if100, paper-table1]
  - name: coral2025_c100_if100_t2h
    adapter: oc
    dataset:
      name: cifar100lt_if100
      data_type: cifar100lt
      imbalance_factor: 0.01
      num_class: 100
      root: ${LTX_DATA_ROOT:-./data}
    train: {total_steps: 200000, batch_size: 128, save_step: 100000, sample_step: 10000}
    eval: {checkpoint_step: 200000, num_images: 50000, guidance_scale: 1.5, ddim_skip_step: 10, paper_metrics: true}
    methods: [{name: t2h, guidance_scale: 1.5}]
    seeds: [0, 1, 2]
    tags: [coral2025, cifar100lt, if100, paper-table1]

aggregation: {enabled: false}
