# Supplementary CIFAR-100-LT run requested alongside the main table.
#
# This is deliberately a separate campaign from unified_cifar_c100_t2h_v1: that
# campaign is IF100 (imb_factor=0.01), while this table cell is IR500, i.e.
# imb_factor=1/500=0.002.  Both rows start from scratch at seed 0 and use the
# same 300k-update budget and evaluation protocol.
campaign:
  name: secondary_c100_ir500_t2h_v1
  description: "Supplementary CIFAR-100-LT IR500: DDPM and CCUA, seed 0"
  protocol: secondary_longtail_v1
  server_config: configs/server.yaml
  paired_seeds: [0]
  default_priority: 80
  strict_preflight: true

repositories:
  t2h_unified:
    url: https://github.com/MediaBrain-SJTU/OC_LT.git
    commit: ced184378e8dc784958b6e14fd687781babd836d
    directory: T2H-unified

shared_train: &shared_train
  total_steps: 300000
  inclusive_final_step: true
  batch_size: 64
  lr: 0.0002
  warmup: 5000
  T: 1000
  beta_1: 0.0001
  beta_T: 0.02
  var_type: fixedlarge
  dropout: 0.1
  grad_clip: 1.0
  num_workers: 4
  save_step: 50000
  sample_step: 100000
  ch: 128
  ch_mult: [1, 2, 2, 2]
  attn: [1]
  num_res_blocks: 2
  ema_decay: 0.9999
  conditional: true
  cfg: true
  amp: false
  checkpoint_prefix: ckpt_unified_v2_

shared_eval: &shared_eval
  checkpoint_step: 300000
  num_images: 50000
  sample_batch_size: 64
  guidance_scale: 1.5
  uniform_labels: true
  sampler_family: ddim_100
  metric_protocol: secondary_longtail_v1
  artifact_namespace: t2h_unified_v2
  paper_metrics: true
  metrics_file: metrics.ir500.json
  kid: true
  kid_subsets: 100
  kid_subset_size: 1000
  kid_seed: 2026
  per_class_metrics_file: metrics.ir500.per_class.json
  longtail_groups: cm_three_way
  inception_batch_size: 16

stages:
  - name: c100_ir500_ddpm
    adapter: t2h_unified
    dataset:
      name: cifar100lt_ir500
      data_type: cifar100lt
      imbalance_factor: 0.002
      split_seed: 0
      num_class: 100
      img_size: 32
      root: "${LTX_DATA_ROOT:-./data}"
    train: *shared_train
    eval: {<<: *shared_eval, sample_method: ddim, ddim_skip_step: 10, standard_metrics: false}
    methods: [{name: ddpm}]
    seeds: [0]
    tags: [secondary-table, cifar100lt, ir500, ddpm, seed-0]

  - name: c100_ir500_ccua
    adapter: t2h_unified
    dataset:
      name: cifar100lt_ir500
      data_type: cifar100lt
      imbalance_factor: 0.002
      split_seed: 0
      num_class: 100
      img_size: 32
      root: "${LTX_DATA_ROOT:-./data}"
    train: *shared_train
    eval: {<<: *shared_eval, sample_method: ddim, ddim_skip_step: 10}
    methods: [{name: ccua, ccua_al: 1.0, ccua_ucl: 1.0, brs: false}]
    seeds: [0]
    tags: [secondary-table, cifar100lt, ir500, ccua, seed-0]

aggregation: {enabled: false}
