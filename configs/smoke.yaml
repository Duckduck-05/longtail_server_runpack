campaign:
  name: smoke_v1
  description: "20-step infrastructure test; not scientific evidence"
  server_config: configs/server.yaml
  paired_seeds: [0]
  strict_preflight: false

repositories:
  coral:
    url: https://github.com/SankarLab/coral-lt-diffusion.git
    branch: main
    directory: coral-lt-diffusion
    patch: patches/apply_coral_weighted_sampler.py

shared_backbone:
  adapter: coral
  train:
    lr: 0.0002
    batch_size: 16
    total_steps: 20
    save_step: 10
    sample_step: 10
    eval_step: 0
    T: 1000
    dropout: 0.1
    amp: true
    cfg: true
    conditional: true
    num_workers: 2
  eval:
    checkpoint_step: 10
    num_images: 32
    sample_method: cfg
    guidance_scales: [0.0]
    prd: false
    improved_prd: false
    standard_metrics: false

stages:
  - name: smoke_coral
    enabled: true
    priority: 100
    adapter: coral
    dataset:
      name: cifar10lt_smoke
      data_type: cifar10lt
      imbalance_factor: 0.01
      root: ${LTX_DATA_ROOT:-./data}
    methods:
      - name: ddpm
      - name: class_balanced
        generated_weight: inverse_class_frequency
    seeds: [0]
    tags: [smoke]

aggregation:
  enabled: false
