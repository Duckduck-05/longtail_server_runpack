# One complete, paper-faithful Table-1 row before committing to all 36 runs.
campaign:
  name: coral2025_c100_if100_compact_v1
  paper_protocol: coral2025_table1_cifar
  description: "CIFAR100-LT IF100: 4 methods × 3 seeds; compact confirmation"
  server_config: configs/server.yaml
  paired_seeds: [0, 1, 2]
  strict_preflight: true

repositories:
  coral: {directory: coral-lt-diffusion, commit: 62c9dfad2da13f5be0f28975e5cd36727c1acc7a}
  cbdm: {directory: CBDM-pytorch, commit: 513f7fffe7369343499611a8f68212a8b40f11a1}
  oc: {directory: OC_LT, commit: ced184378e8dc784958b6e14fd687781babd836d}

shared_backbone:
  adapter: coral
  train: {lr: 0.0002, batch_size: 128, total_steps: 150000, save_step: 50000, sample_step: 10000, eval_step: 0, T: 1000, dropout: 0.1, amp: true, cfg: true, conditional: true, num_workers: 8}
  eval: {checkpoint_step: 150000, num_images: 50000, sample_method: cfg, prd: false, improved_prd: false, standard_metrics: false, paper_metrics: true}

stages:
  - name: coral2025_c100_if100_core
    adapter: coral
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, root: "${LTX_DATA_ROOT:-./data}"}
    methods:
      - {name: ddpm, guidance_scale: 0.8}
      - {name: cbdm, guidance_scale: 1.6, flags: [--cb, --tau=1.0]}
      - {name: coral, guidance_scale: 0.8, flags: [--supcon, --supcon_weight=0.01, --supcon_temp=0.09, --temperature_scaling=1.0]}
    seeds: [0, 1, 2]
    tags: [coral2025, compact, cifar100lt, if100, paper-table1]
  - name: coral2025_c100_if100_t2h
    adapter: oc
    dataset: {name: cifar100lt_if100, data_type: cifar100lt, imbalance_factor: 0.01, num_class: 100, root: "${LTX_DATA_ROOT:-./data}"}
    train: {total_steps: 200000, batch_size: 128, save_step: 100000, sample_step: 10000}
    eval: {checkpoint_step: 200000, num_images: 50000, guidance_scale: 1.5, ddim_skip_step: 10, paper_metrics: true}
    methods: [{name: t2h, guidance_scale: 1.5}]
    seeds: [0, 1, 2]
    tags: [coral2025, compact, cifar100lt, if100, paper-table1]

aggregation: {enabled: false}
